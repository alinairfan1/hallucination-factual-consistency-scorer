services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scorer
      POSTGRES_PASSWORD: scorer
      POSTGRES_DB: scorer
    ports:
      - "5433:5432"
    volumes:
      - scorer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scorer"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      SCORER_DATABASE_URL: postgresql+psycopg://scorer:scorer@db:5432/scorer
      SCORER_MISTRAL_API_KEY: ${SCORER_MISTRAL_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  scorer_pgdata:
