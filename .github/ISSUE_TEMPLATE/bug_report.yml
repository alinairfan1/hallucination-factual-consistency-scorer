name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, including request payloads if it's an API issue.
      placeholder: |
        1. `docker compose up -d --build`
        2. POST /v1/score with `{...}`
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v1.0.0 or commit SHA
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Backend (FastAPI / scoring / benchmark CLI)
        - Frontend (web/)
        - Docker / infra
        - Docs
    validations:
      required: false
